<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard 2026</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14152B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard 2026">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* ===== Base: mesma identidade do Dashboard 2026, com volume de jogo ("Arcade suave") ===== */
        :root {
            --bg-body: #F1F2FA;
            --bg-sidebar: #14152B;
            --surface-game: #23244A;
            --surface-game-line: #2B2C4D;
            --text-sidebar: #B8BBDD;
            --bg-card: #ffffff;
            --text-main: #2B2D42;
            --text-heading: #16172E;
            --text-muted: #55577A;
            --border: #E4E5F1;
            --border-subtle: #ECEDF6;
            --primary: #6C5CE7;
            --primary-dark: #5642D6;
            --primary-shadow: #4632C4;
            --primary-soft: #EEEBFD;
            --xp: #F59E0B;
            --xp-light: #FCD34D;
            --xp-shadow: #B45309;
            --xp-text: #92400E;
            --xp-soft: #FEF3C7;
            --fire: #EA580C;
            --fire-light: #FDBA74;
            --fire-bg: #2A1A10;
            --shield: #93C5FD;
            --shield-bg: #1C2A4A;
            --r-sm: 12px;
            --r-md: 16px;
            --r-lg: 18px;
            --r-xl: 22px;
            --font-display: 'Sora', 'Segoe UI', sans-serif;
            --font-body: 'Inter', 'Segoe UI', sans-serif;
            /* cor do mundo atual; cada mundo sobrescreve via style */
            --w: var(--primary);
            --w-dark: var(--primary-dark);
            --w-shadow: var(--primary-shadow);
            --w-soft: var(--primary-soft);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { background: var(--bg-body); color: var(--text-main); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
        h1, h2, h3, h4, h5 { font-family: var(--font-display); color: var(--text-heading); letter-spacing: -0.01em; margin: 0; }
        button { font: inherit; }
        ::selection { background: var(--primary-soft); color: var(--primary-dark); }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        .app { display: flex; min-height: 100vh; }

        /* ===== Menu lateral (computador) ===== */
        .sidebar { width: 272px; flex-shrink: 0; background: var(--bg-sidebar); color: var(--text-sidebar); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 14px; }
        .brand { display: flex; align-items: center; gap: 10px; color: #fff; font: 800 1.05rem var(--font-display); padding: 0 6px; }
        .brand .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--primary-shadow); }
        .brand small { display: block; font: 600 0.72rem var(--font-body); color: var(--text-sidebar); margin-top: 2px; }
        .side-hud { background: var(--surface-game); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; color: #fff; border: 0; text-align: left; cursor: pointer; width: 100%; }
        .side-hud .sh-top { display: flex; align-items: center; gap: 10px; }
        .side-hud .sh-lv { width: 40px; height: 40px; border-radius: 12px; background: var(--xp); color: #14152B; font: 800 1rem var(--font-display); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 var(--xp-shadow); }
        .side-hud .sh-name { font: 700 0.9rem var(--font-display); }
        .side-hud .sh-sub { font-size: 0.74rem; font-weight: 600; color: var(--text-sidebar); }
        .side-label { font: 800 0.68rem var(--font-body); letter-spacing: 0.8px; text-transform: uppercase; color: #8F92C4; padding: 6px 12px 0; }
        .side-nav { display: flex; flex-direction: column; gap: 3px; }
        .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; color: var(--text-sidebar); padding: 8px 10px; border-radius: var(--r-sm); font: 600 0.92rem var(--font-body); text-align: left; cursor: pointer; transition: background 0.15s, color 0.15s; }
        .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .nav-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-btn .nb-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); }
        .nav-btn.active .nb-icon { background: var(--w); color: #fff; }
        .nav-btn .nb-lv { margin-left: auto; font: 800 0.72rem var(--font-display); color: #8F92C4; }
        .side-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .side-foot .sync-status-text { font-size: 0.72rem; text-align: center; color: var(--text-sidebar); }
        .btn-ghost-dark { border: 0; width: 100%; background: rgba(255,255,255,0.06); color: #fff; border-radius: var(--r-sm); padding: 9px 12px; font: 700 0.82rem var(--font-body); cursor: pointer; }
        .btn-ghost-dark:hover { background: rgba(255,255,255,0.12); }

        /* ===== Área principal ===== */
        .main-content { flex: 1; min-width: 0; padding: 28px; }
        .view { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .sec-head h2 { font-size: 1.12rem; font-weight: 700; }
        .link-btn { border: 0; background: none; color: var(--primary-dark); font: 700 0.85rem var(--font-body); cursor: pointer; padding: 4px; }
        .muted { color: var(--text-muted); }
        .card-w { background: #fff; border-radius: var(--r-lg); box-shadow: 0 3px 0 var(--border); }

        /* ===== Botões que afundam ===== */
        .btn-3d { border: 0; border-radius: 14px; padding: 10px 16px; min-height: 42px; font: 800 0.88rem var(--font-display); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: transform 0.08s, box-shadow 0.08s, filter 0.12s; text-decoration: none; }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
        .btn-3d:hover { filter: brightness(1.05); }
        .btn-primary3 { background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-shadow); }
        .btn-w { background: var(--w-dark); color: #fff; box-shadow: 0 4px 0 var(--w-shadow); }
        .btn-xp { background: var(--xp); color: #14152B; box-shadow: 0 4px 0 var(--xp-shadow); }
        .btn-dark { background: var(--surface-game); color: #fff; box-shadow: 0 4px 0 #0A0B1A; }
        .btn-light3 { background: #fff; color: var(--text-main); box-shadow: 0 0 0 2px var(--border), 0 4px 0 var(--border); }
        .btn-xs { padding: 6px 11px; min-height: 34px; font-size: 0.78rem; border-radius: var(--r-sm); }
        .icon-btn { border: 0; width: 42px; height: 42px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.14); color: #fff; flex-shrink: 0; }

        /* ===== Ficha do jogador ===== */
        .player-card { background: var(--bg-sidebar); color: #fff; border-radius: var(--r-xl); padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #0A0B1A; }
        .pc-top { display: flex; align-items: center; gap: 12px; }
        .avatar { position: relative; width: 60px; height: 60px; border-radius: 18px; background: var(--primary); display: flex; align-items: center; justify-content: center; font: 800 1.6rem var(--font-display); flex-shrink: 0; box-shadow: 0 4px 0 var(--primary-shadow); }
        .lv-badge { position: absolute; right: -7px; bottom: -7px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; background: var(--xp); color: #14152B; border: 3px solid var(--bg-sidebar); font: 800 0.78rem/22px var(--font-display); text-align: center; }
        .pc-name { flex: 1; min-width: 0; }
        .pc-nome { font: 700 1.15rem var(--font-display); }
        .pc-sub { font-size: 0.84rem; font-weight: 600; color: var(--text-sidebar); }
        .pc-sub b { color: var(--xp-light); }
        .pc-chips { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .chip-fire { display: inline-flex; align-items: center; gap: 5px; background: var(--fire-bg); color: var(--fire-light); border-radius: 999px; padding: 5px 11px; font: 800 0.82rem var(--font-display); white-space: nowrap; }
        .chip-shield { display: inline-flex; align-items: center; gap: 4px; background: var(--shield-bg); color: var(--shield); border-radius: 999px; padding: 4px 10px; font: 700 0.75rem var(--font-body); white-space: nowrap; }
        .xp-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; font-weight: 700; color: var(--text-sidebar); flex-wrap: wrap; }
        .xp-row .xp-num { color: var(--xp-light); }
        .xp-bar { height: 14px; border-radius: 999px; background: var(--surface-game-line); overflow: hidden; }
        .xp-bar > div { height: 100%; border-radius: 999px; background: var(--xp); box-shadow: inset 0 -4px 0 #D97706; transition: width 0.4s ease-out; }
        .mini-bar { display: block; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
        .mini-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--w); }

        /* ===== Missões ===== */
        .missions { padding: 4px 14px; }
        .mission { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F1F2FA; }
        .mission:last-child { border-bottom: 0; }
        .m-check { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #CBD1E8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; }
        .mission.done .m-check { background: #16A34A; border-color: #16A34A; color: #fff; }
        .m-text { flex: 1; font-size: 0.9rem; font-weight: 600; }
        .m-text small { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
        .mission.done .m-text { color: var(--text-muted); text-decoration: line-through; }
        .xp-pill { background: var(--xp-soft); color: var(--xp-text); border-radius: 999px; padding: 3px 9px; font: 800 0.74rem var(--font-display); white-space: nowrap; }
        .mission.done .xp-pill { background: #DCFCE7; color: #15803D; }
        .chest { display: flex; align-items: center; gap: 10px; padding: 12px 0 10px; }
        .chest-icon { width: 40px; height: 40px; border-radius: var(--r-sm); background: #F1F2FA; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
        .chest.open .chest-icon { background: var(--xp); color: #14152B; }
        .pips { display: flex; gap: 4px; margin-top: 6px; }
        .pips span { flex: 1; height: 8px; border-radius: 999px; background: var(--border); }
        .pips span.on { background: var(--xp); }

        /* ===== Mundos ===== */
        .worlds-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .world-tile { border: 0; background: #fff; border-radius: var(--r-md); box-shadow: 0 3px 0 var(--border); padding: 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; transition: transform 0.08s; }
        .world-tile:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
        .wt-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--w-soft); color: var(--w-dark); display: flex; align-items: center; justify-content: center; }
        .wt-name { font: 700 0.95rem var(--font-display); color: var(--text-heading); }
        .wt-meta { font-size: 0.75rem; font-weight: 700; color: var(--w-dark); }
        .world-tile.big { padding: 16px; gap: 8px; }
        .world-tile.big .wt-icon { width: 46px; height: 46px; border-radius: 14px; }

        .continue-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
        .ci-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--w-soft); color: var(--w-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ci-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .ci-title { font: 700 0.95rem var(--font-display); color: var(--text-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ci-meta { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        .stack { display: flex; flex-direction: column; gap: 10px; }

        /* ===== Cabeçalho do mundo ===== */
        .world-head { background: var(--w-dark); color: #fff; border-radius: var(--r-xl); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 0 var(--w-shadow); }
        .wh-top { display: flex; align-items: center; gap: 12px; }
        .wh-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--w-soft); color: var(--w-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .world-head h1 { color: #fff; font-size: 1.45rem; font-weight: 800; }
        .wh-sub { font-size: 0.84rem; font-weight: 600; opacity: 0.92; }
        .wh-xp { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; font-weight: 700; flex-wrap: wrap; }
        .wh-bar { height: 12px; border-radius: 999px; background: rgba(0,0,0,0.25); overflow: hidden; }
        .wh-bar > div { height: 100%; border-radius: 999px; background: #fff; transition: width 0.4s ease-out; }
        .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
        .chip { border: 0; border-radius: 999px; padding: 8px 14px; font: 800 0.8rem var(--font-display); background: #fff; color: var(--text-main); box-shadow: 0 3px 0 var(--border); cursor: pointer; white-space: nowrap; }
        .chip[aria-pressed="true"] { background: var(--bg-sidebar); color: #fff; box-shadow: 0 3px 0 #000; }

        /* ===== Tabela / cards dos itens ===== */
        .list-box { background: #fff; border-radius: var(--r-lg); box-shadow: 0 3px 0 var(--border); overflow: hidden; }
        .table-responsive { overflow-x: auto; }
        table.items { margin: 0; width: 100%; border-collapse: collapse; }
        table.items th { position: sticky; top: 0; background: #FAFAFE; z-index: 2; color: var(--text-muted); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; padding: 13px 14px; border-bottom: 2px solid var(--border-subtle); cursor: pointer; user-select: none; white-space: nowrap; }
        table.items th:hover { background: #F1F2FA; color: var(--text-heading); }
        table.items td { padding: 10px 14px; border-bottom: 1px solid #F1F2FA; vertical-align: middle; font-size: 0.92rem; background: transparent; }
        table.items tbody tr { transition: background-color 0.15s; border-left: 4px solid transparent; }
        table.items tbody tr > td:first-child { border-left: 4px solid transparent; }
        tr[data-status="status-concluido"] { background: #DCFCE7; }
        tr[data-status="status-concluido"] > td:first-child { border-left-color: #16A34A; }
        tr[data-status="status-aguardando"] { background: #DBEAFE; }
        tr[data-status="status-aguardando"] > td:first-child { border-left-color: #93C5FD; }
        tr[data-status="status-na"] { background: #F8F8FC; }
        tr[data-status="status-na"] > td:first-child { border-left-color: #CBD1E8; }
        tr[data-status="status-concluido"] { opacity: 0.6; transition: opacity 0.15s; }
        tr[data-status="status-concluido"]:hover, tr[data-status="status-concluido"]:focus-within { opacity: 1; }
        .sort-icon { font-size: 0.8rem; margin-left: 5px; color: var(--w-dark); }
        .action-btns { display: flex; gap: 6px; }
        .btn-icon { border: 0; width: 36px; height: 36px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: #F1F2FA; color: var(--text-muted); box-shadow: 0 3px 0 var(--border); transition: transform 0.08s; }
        .btn-icon:active { transform: translateY(3px); box-shadow: none; }
        .btn-icon.danger { background: #FDECEC; color: #B93030; box-shadow: 0 3px 0 #FBD9D9; }
        .btn-icon.boss { background: var(--fire-bg); color: var(--fire-light); box-shadow: 0 3px 0 #000; }
        .drag-handle { cursor: grab; touch-action: none; }
        .drag-handle:active { cursor: grabbing; }
        tr.dragging { opacity: 0.7; box-shadow: 0 10px 26px rgba(20,21,55,0.28); position: relative; z-index: 50; background: #fff !important; }

        .editable-cell { cursor: text; padding: 6px 8px; border-radius: 8px; min-height: 24px; display: block; width: 100%; border: 1px solid transparent; transition: 0.15s; }
        .editable-cell:hover { border-color: var(--border); background: #FAFAFE; }
        .editable-cell:focus { outline: none; box-shadow: 0 0 0 3px var(--w-soft); background: #fff; border-color: var(--w-dark); }
        .cell-item-name { font: 600 1rem var(--font-display); color: var(--text-heading); }
        tr[data-status="status-aberto"] .cell-item-name { font-weight: 800; }
        tr[data-status="status-aberto"] .cell-item-name::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #EAB308; box-shadow: 0 0 0 3px rgba(234,179,8,0.25); vertical-align: middle; }

        .status-select { border: 1px solid rgba(20,21,55,0.12); font-size: 0.72rem; font-weight: 800; border-radius: 999px; padding: 7px 14px; cursor: pointer; appearance: none; -webkit-appearance: none; text-align: center; text-transform: uppercase; letter-spacing: 0.3px; font-family: var(--font-body); }
        .status-concluido { background-color: #DCFCE7; color: #15803D; }
        .status-aberto { background-color: #FFEDD5; color: #C2410C; }
        .status-aguardando { background-color: #DBEAFE; color: #1D4ED8; }
        .status-na { background-color: #fff; color: #55577A; }

        .phase-wrap { display: flex; align-items: center; gap: 10px; min-width: 230px; }
        .segs { display: flex; gap: 4px; flex: 1; min-width: 96px; }
        .seg { flex: 1; height: 30px; border: 0; padding: 0; background: transparent; cursor: pointer; position: relative; }
        .seg::after { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 12px; border-radius: 999px; background: #E4E5F1; }
        .seg.on::after { background: var(--w); box-shadow: inset 0 -3px 0 var(--w-dark); }
        .segs-static { display: flex; gap: 4px; }
        .segs-static span { flex: 1; height: 10px; border-radius: 999px; background: #E4E5F1; }
        .segs-static span.on { background: var(--w); box-shadow: inset 0 -3px 0 var(--w-dark); }
        .phase-label { font: 700 0.78rem var(--font-body); color: var(--text-muted); white-space: nowrap; min-width: 54px; }

        .medal { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 800; padding: 5px 12px; border-radius: 999px; cursor: text; min-width: 48px; border: 2px solid transparent; outline: none; }
        .medal.r-lendario { color: #92400E; background: #FEF3C7; border-color: #F59E0B; }
        .medal.r-epico { color: #3F3F5C; background: #EEEFF7; border-color: #A2A5C4; }
        .medal.r-raro { color: #7C2D12; background: #FFEDD5; border-color: #EA580C; }

        /* ===== Coleção (cards) ===== */
        .collection { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .ccard { border: 3px solid #CBD1E8; background: #fff; border-radius: var(--r-md); padding: 10px; min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; text-align: left; cursor: pointer; transition: transform 0.1s; }
        .ccard:hover { transform: translateY(-2px); }
        .ccard .cc-tier { font: 800 0.66rem var(--font-body); letter-spacing: 0.5px; }
        .ccard .cc-title { font: 700 0.85rem/1.25 var(--font-display); color: var(--text-heading); }
        .ccard .cc-nota { font: 800 0.82rem var(--font-display); }
        .r-lendario.ccard, .rcard.r-lendario { border-color: #F59E0B; background: #FEF3C7; }
        .r-epico.ccard, .rcard.r-epico { border-color: #A2A5C4; background: #EEEFF7; }
        .r-raro.ccard, .rcard.r-raro { border-color: #EA580C; background: #FFEDD5; }
        .r-mundo.ccard, .rcard.r-mundo { border-color: var(--w); background: var(--w-soft); }
        .t-mundo { color: var(--w-dark); }
        .t-lendario { color: #92400E; } .t-epico { color: #3F3F5C; } .t-raro { color: #7C2D12; } .t-comum { color: #55577A; }

        /* ===== Chefões ===== */

                        console.warn('Progresso do jogo sem acesso à nuvem; fica salvo neste aparelho.', err);
                    });
                });

                firebase.auth().signInAnonymously().catch((err) => {
                    console.warn('Não foi possível conectar à sincronização na nuvem; seguindo só com dados locais.', err);
                    setSyncStatusText('Falha ao autenticar na nuvem (veja o console).');
                });
            } catch (err) {
                console.warn('Sincronização na nuvem indisponível; seguindo só com dados locais.', err);
                setSyncStatusText('Sincronização na nuvem indisponível.');
            }
        }

        // Ordem fixa das abas, independente da ordem em que o localStorage/nuvem
        // devolve as chaves (o Realtime Database, por exemplo, reordena objetos por chave).
        const TAB_ORDER = ["metas", "series", "animes", "filmes", "jogos", "livros"];
        function orderedTabKeys() {
            const isTab = k => appData[k] && Array.isArray(appData[k].columns);
            const known = TAB_ORDER.filter(isTab);
            const extra = Object.keys(appData).filter(k => !TAB_ORDER.includes(k) && isTab(k));
            return known.concat(extra);
        }

        // O Firebase apaga listas vazias; garante que toda aba tenha colunas e linhas
        function normalizeData() {
            Object.keys(appData || {}).forEach(k => {
                const t = appData[k];
                if (!t || typeof t !== 'object') return;
                if (t.columns && !Array.isArray(t.columns)) t.columns = Object.values(t.columns);
                if (Array.isArray(t.columns) && !Array.isArray(t.rows)) t.rows = t.rows ? Object.values(t.rows) : [];
                (t.rows || []).forEach(r => {
                    if (r && r.chefao && r.chefao.etapas && !Array.isArray(r.chefao.etapas)) r.chefao.etapas = Object.values(r.chefao.etapas);
                });
            });
        }

        // ==========================================
        // REGRAS DO JOGO
        // XP vem dos próprios dados (fases, zerados, notas) + bônus de missões.
        // Nada tira XP; desfazer um item só devolve o XP daquele item.
        // ==========================================
        const playerCost = n => 200 * n + 100;   // XP para passar do nível n do jogador
        const worldCost = n => 80 * n + 40;      // XP para passar do nível n de um mundo
        const XP_FASE = 15, XP_NOTA = 10, XP_GOLPE = 50, XP_CHEFAO = 300, XP_BAU = 30, XP_SEMANA = 100;

        function cols(key) {
            const c = (appData[key] && appData[key].columns) || [];
            return {
                status: c.find(x => x.toUpperCase().includes('STATUS')),
                prog: c.find(x => x.toUpperCase().includes('PROGRESSO')),
                nota: c.find(x => x.toUpperCase().trim() === 'NOTA'),
                item: c.find(x => x.toUpperCase().trim() === 'ITEM') || c[0]
            };
        }
        function normStatus(v) {
            let s = (v === undefined || v === null) ? '' : String(v).trim().toUpperCase();
            if (s === 'CONCLUÍDO' || s === 'REALIZADO') s = 'CONCLUIDO';
            if (s === 'STAND BY') s = 'AGUARDANDO';
            return s;
        }
        function findRow(key, id) { return ((appData[key] && appData[key].rows) || []).find(r => r && r.id === id); }
        function isDone(key, row) { const c = cols(key); return !!c.status && normStatus(row[c.status]) === 'CONCLUIDO'; }
        function isBoss(row) { return !!(row && row.chefao && Array.isArray(row.chefao.etapas) && row.chefao.etapas.length); }
        function bossDone(row) { return row.chefao.etapas.filter(e => e && e.feito).length; }
        function rowPhase(key, row) {
            if (isDone(key, row)) return 4;
            const c = cols(key);
            if (!c.prog) return 0;
            const p = parseInt(row[c.prog]) || 0;
            return Math.max(0, Math.min(4, Math.floor(p / 25)));
        }
        function rowNota(key, row) {
            const c = cols(key);
            if (!c.nota) return NaN;
            const v = parseFloat(String(row[c.nota] === undefined ? '' : row[c.nota]).replace(',', '.'));
            return isNaN(v) ? NaN : v;
        }
        function rarity(n) {
            if (isNaN(n)) return 'comum';
            if (n >= 10) return 'lendario';
            if (n >= 9) return 'epico';
            if (n >= 7) return 'raro';
            return 'comum';
        }
        const RARITY_LABEL = { lendario: 'LENDÁRIO', epico: 'ÉPICO', raro: 'RARO', comum: 'COMUM' };
        // Mundos sem coluna de nota (ex.: Metas) não têm raridade: o card fica na cor do mundo
        function cardTier(key, n) { return cols(key).nota ? rarity(n) : 'mundo'; }
        function tierLabel(key, rr) { return rr === 'mundo' ? (key === 'metas' ? 'META BATIDA' : 'ZERADO') : RARITY_LABEL[rr]; }
        function rowXP(key, row) {
            if (!row) return 0;
            if (isBoss(row)) {
                const d = bossDone(row), t = row.chefao.etapas.length;
                return d * XP_GOLPE + (d === t ? XP_CHEFAO : 0);
            }
            let xp = rowPhase(key, row) * XP_FASE;
            if (isDone(key, row)) {
                xp += world(key).xp;
                if (!isNaN(rowNota(key, row))) xp += XP_NOTA;
            }
            return xp;
        }
        function worldXP(key) { return ((appData[key] && appData[key].rows) || []).reduce((s, r) => s + rowXP(key, r), 0); }
        function totalXP() { return orderedTabKeys().reduce((s, k) => s + worldXP(k), 0) + (gameState.bonusXP || 0); }
        function levelInfo(xp, cost) {
            let lv = 1, rest = Math.max(0, xp);
            while (rest >= cost(lv) && lv < 999) { rest -= cost(lv); lv++; }
            return { lv, cur: rest, need: cost(lv), pct: Math.round(100 * rest / cost(lv)) };
        }
        function snapshot() { const xp = totalXP(); return { xp, lv: levelInfo(xp, playerCost).lv }; }
        const fmt = n => Number(n || 0).toLocaleString('pt-BR');

        // ===== Estado do jogo (ofensiva, missões, escudos, título) =====
        const GAME_KEY = 'dashboard2026_jogo_v1';
        function defaultGame() {
            return { v: 1, nome: 'Guilherme', titulo: '', bonusXP: 0, escudos: 0, recorde: 0, log: {}, missoes: {}, semanas: {} };
        }
        let gameState = defaultGame();
        function loadGame() {
            try {
                const s = JSON.parse(localStorage.getItem(GAME_KEY) || 'null');
                if (s) gameState = Object.assign(defaultGame(), s);
            } catch (e) { /* estado corrompido: começa do zero */ }
        }
        function saveGame() {
            pruneGame();
            localStorage.setItem(GAME_KEY, JSON.stringify(gameState));
            if (gameCloudReady && gameRef) gameRef.set(gameState).catch(() => {});
        }
        function pruneGame() {
            const keep = addDays(todayStr(), -120);
            Object.keys(gameState.log || {}).forEach(d => { if (d < keep) delete gameState.log[d]; });
            const weeks = Object.keys(gameState.semanas || {}).sort();
            while (weeks.length > 20) delete gameState.semanas[weeks.shift()];
        }

        // ===== Datas (dia local do aparelho) =====
        function dstr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function todayStr() { return dstr(new Date()); }
        function addDays(s, n) { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); }
        function weekStart(s) { const [y, m, d] = s.split('-').map(Number); const wd = (new Date(y, m - 1, d).getDay() + 6) % 7; return addDays(s, -wd); }
        function fmtDate(s) { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}`; }

        // ===== Registro do dia (alimenta ofensiva, missões e desafio da semana) =====
        // f = fase avançada, z = item zerado, n = nota dada, q = começou algo da fila
        function logEvent(type, key) {
            const t = todayStr();
            gameState.log = gameState.log || {};
            const l = gameState.log[t] || (gameState.log[t] = {});
            l[type] = (l[type] || 0) + 1;
            if (key) {
                const k = type + 't';
                l[k] = l[k] || {};
                l[k][key] = (l[k][key] || 0) + 1;
            }
        }
        function isActive(s) { const l = (gameState.log || {})[s]; return !!(l && (l.f || l.z || l.n || l.q)); }
        function covered(s) { const l = (gameState.log || {})[s]; return isActive(s) || !!(l && l.escudo); }
        function streak() {
            let d = todayStr();
            if (!covered(d)) d = addDays(d, -1);
            let n = 0;
            while (covered(d) && n < 3650) { n++; d = addDays(d, -1); }
            return n;
        }
        // Escudo: se ontem ficou parado mas anteontem não, um escudo guardado salva a ofensiva
        function applyShields() {
            const y = addDays(todayStr(), -1), yy = addDays(y, -1);
            if (!covered(y) && covered(yy) && (gameState.escudos || 0) > 0) {
                gameState.log[y] = gameState.log[y] || {};
                gameState.log[y].escudo = true;
                gameState.escudos--;
                saveGame();
                setTimeout(() => showToast(`${icon('shield', 18)} Um escudo salvou sua ofensiva de ontem`), 600);
            }
        }
        function updateRecord() { gameState.recorde = Math.max(gameState.recorde || 0, streak()); }

        // ===== Missões do dia =====
        function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
        function seeded(seed) { let x = seed || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; }; }
        function anyRow(pred) { return orderedTabKeys().some(k => (appData[k].rows || []).some(r => r && pred(k, r))); }
        function missionDefs() {
            const defs = {
                fase1: { text: 'Avance uma fase em qualquer mundo', xp: 15, goal: 1, prog: l => l.f || 0, grp: 'a', ok: true },
                fase3: { text: 'Avance 3 fases hoje', xp: 25, goal: 3, prog: l => l.f || 0, grp: 'b', ok: true },
                zerar: { text: 'Zere um item', xp: 25, goal: 1, prog: l => l.z || 0, grp: 'b', ok: anyRow((k, r) => !isDone(k, r) && !!cols(k).status) },
                nota: { text: 'Dê nota a algo que você zerou', xp: 10, goal: 1, prog: l => l.n || 0, grp: 'c', ok: anyRow((k, r) => isDone(k, r) && !!cols(k).nota && isNaN(rowNota(k, r))) },
                fila: { text: 'Comece algo da sua fila', xp: 10, goal: 1, prog: l => l.q || 0, grp: 'c', ok: anyRow((k, r) => !!cols(k).status && normStatus(r[cols(k).status]) === 'AGUARDANDO') }
            };
            orderedTabKeys().forEach(k => {
                defs['mundo_' + k] = {
                    text: 'Avance uma fase em ' + world(k).name, xp: 15, goal: 1, grp: 'a',
                    prog: l => (l.ft && l.ft[k]) || 0,
                    ok: !!cols(k).prog && (appData[k].rows || []).some(r => r && !isDone(k, r) && !isBoss(r))
                };
            });
            return defs;
        }
        function todaysMissions() {
            const t = todayStr();
            const defs = missionDefs();
            let m = gameState.missoes || {};
            if (m.dia !== t || !Array.isArray(m.ids) || !m.ids.length) {
                const rnd = seeded(hashStr(t));
                const ok = Object.keys(defs).filter(id => defs[id].ok);
                const pick = grp => { const c = ok.filter(id => defs[id].grp === grp); return c.length ? c[Math.floor(rnd() * c.length)] : null; };
                const ids = [pick('a'), pick('b'), pick('c')].filter(Boolean);
                const rest = ok.filter(id => !ids.includes(id));
                while (ids.length < 3 && rest.length) ids.push(rest.splice(Math.floor(rnd() * rest.length), 1)[0]);
                m = { dia: t, ids, feitas: {}, bau: false };
                gameState.missoes = m;
                saveGame();
            }
            const l = (gameState.log || {})[t] || {};
            return m.ids.filter(id => defs[id]).map(id => {
                const d = defs[id];
                return { id, text: d.text, xp: d.xp, goal: d.goal, cur: Math.min(d.goal, d.prog(l)), done: !!(m.feitas && m.feitas[id]) };
            });
        }
        function checkMissions() {
            const list = todaysMissions();
            const m = gameState.missoes;
            m.feitas = m.feitas || {};
            list.forEach(x => {
                if (!x.done && x.cur >= x.goal) {
                    m.feitas[x.id] = true;
                    gameState.bonusXP = (gameState.bonusXP || 0) + x.xp;
                    showToast(`${icon('check', 18)} Missão cumprida! +${x.xp} XP`);
                }
            });
            if (!m.bau && list.length && list.every(x => m.feitas[x.id])) {
                m.bau = true;
                gameState.bonusXP += XP_BAU;
                showToast(`${icon('chest', 18)} Baú diário aberto! +${XP_BAU} XP`, 'xp');
            }
        }

        // ===== Desafio da semana =====
        const WEEKLY = [
            { id: 'mundos', text: 'Zere 2 itens de mundos diferentes', goal: 2, prog: days => { const s = new Set(); days.forEach(l => Object.keys(l.zt || {}).forEach(k => s.add(k))); return s.size; } },
            { id: 'fases', text: 'Avance 10 fases na semana', goal: 10, prog: days => days.reduce((s, l) => s + (l.f || 0), 0) },
            { id: 'notas', text: 'Dê nota a 3 itens zerados', goal: 3, prog: days => days.reduce((s, l) => s + (l.n || 0), 0) }
        ];
        function weekly() {
            const ws = weekStart(todayStr());
            const def = WEEKLY[hashStr(ws) % WEEKLY.length];
            const days = [...Array(7)].map((_, i) => (gameState.log || {})[addDays(ws, i)] || {});
            return { ws, def, cur: Math.min(def.goal, def.prog(days)), done: !!(gameState.semanas || {})[ws], end: addDays(ws, 6) };
        }
        function checkWeekly() {
            const w = weekly();
            if (!w.done && w.cur >= w.def.goal) {
                gameState.semanas = gameState.semanas || {};
                gameState.semanas[w.ws] = true;
                gameState.bonusXP = (gameState.bonusXP || 0) + XP_SEMANA;
                gameState.escudos = Math.min(2, (gameState.escudos || 0) + 1);
                showToast(`${icon('shield', 18)} Desafio da semana! +${XP_SEMANA} XP e 1 escudo`, 'xp');
            }
        }

        // ===== Troféus (bronze, prata, ouro) =====
        function stats() {
            const s = { done: {}, total: 0, notas: 0, lend: 0, bosses: 0 };
            orderedTabKeys().forEach(k => {
                let c = 0;
                (appData[k].rows || []).forEach(r => {
                    if (!r || !isDone(k, r)) return;
                    c++; s.total++;
                    const n = rowNota(k, r);
                    if (!isNaN(n)) { s.notas++; if (n >= 10) s.lend++; }
                    if (isBoss(r)) s.bosses++;
                });
                s.done[k] = c;
            });
            return s;
        }
        const TROPHIES = [
            { id: 'fogo', name: 'Fogo aceso', title: 'Imparável', icon: 'flame', tiers: [7, 30, 100], unit: 'dias seguidos', desc: 'Mantenha a ofensiva: 7, 30 e 100 dias seguidos.', val: () => Math.max(gameState.recorde || 0, streak()) },
            { id: 'series', name: 'Maratonista', icon: 'tv', world: 'series', tiers: [5, 15, 30], unit: 'séries zeradas', desc: 'Zere séries: 5, 15 e 30 temporadas.' },
            { id: 'animes', name: 'Otaku', icon: 'spark', world: 'animes', tiers: [5, 15, 30], unit: 'animes zerados', desc: 'Zere animes: 5, 15 e 30.' },
            { id: 'filmes', name: 'Cinéfilo', icon: 'film', world: 'filmes', tiers: [5, 15, 30], unit: 'filmes zerados', desc: 'Zere filmes: 5, 15 e 30.' },
            { id: 'jogos', name: 'Zerador', icon: 'pad', world: 'jogos', tiers: [3, 10, 25], unit: 'jogos zerados', desc: 'Zere jogos: 3, 10 e 25.' },
            { id: 'livros', name: 'Rato de biblioteca', icon: 'book', world: 'livros', tiers: [3, 10, 25], unit: 'livros zerados', desc: 'Zere livros: 3, 10 e 25.' },
            { id: 'metas', name: 'Decidido', icon: 'target', world: 'metas', tiers: [5, 15, 24], unit: 'metas batidas', desc: 'Bata metas do ano: 5, 15 e 24.' },
            { id: 'critico', name: 'Crítico', icon: 'star', tiers: [10, 50, 100], unit: 'notas dadas', desc: 'Dê nota aos itens que você zerou: 10, 50 e 100.', val: s => s.notas },
            { id: 'lenda', name: 'Lenda', icon: 'crown', tiers: [1, 5, 10], unit: 'cards lendários', desc: 'Junte cards lendários (nota 10): 1, 5 e 10.', val: s => s.lend },
            { id: 'chefoes', name: 'Caçador de chefões', icon: 'sword', tiers: [1, 3, 10], unit: 'chefões derrotados', desc: 'Derrote metas-chefão: 1, 3 e 10.', val: s => s.bosses },
            { id: 'colecao', name: 'Colecionador', icon: 'grid', tiers: [25, 75, 150], unit: 'itens zerados', desc: 'Zere itens em qualquer mundo: 25, 75 e 150.', val: s => s.total },
            { id: 'nivel', name: 'Veterano', icon: 'bolt', tiers: [5, 10, 20], unit: 'níveis', desc: 'Suba de nível: 5, 10 e 20.', val: () => levelInfo(totalXP(), playerCost).lv }
        ];
        const TIER_NAME = ['BLOQUEADO', 'BRONZE', 'PRATA', 'OURO'];
        function trophyList() { return TROPHIES.filter(t => !t.world || appData[t.world]); }
        function trophyState(t, s) {
            const v = t.world ? (s.done[t.world] || 0) : t.val(s);
            const tier = v >= t.tiers[2] ? 3 : v >= t.tiers[1] ? 2 : v >= t.tiers[0] ? 1 : 0;
            return { v, tier, next: t.tiers[Math.min(tier, 2)] };
        }
        function checkTrophies(silent) {
            const s = stats();
            const first = !gameState.trofeus;
            gameState.trofeus = gameState.trofeus || {};
            let changed = false;
            trophyList().forEach(t => {
                const st = trophyState(t, s);
                const prev = gameState.trofeus[t.id] || 0;
                if (st.tier > prev) {
                    gameState.trofeus[t.id] = st.tier;
                    changed = true;
                    if (!silent && !first) showToast(`${icon('trophy', 18)} Troféu ${t.name}: ${TIER_NAME[st.tier].toLowerCase()}!`, 'trophy');
                }
            });
            if (changed) saveGame();
        }
        function unlockedTitles() {
            const s = stats();
            const titles = ['Novato'];
            trophyList().forEach(t => { if (trophyState(t, s).tier > 0) titles.push(t.title || t.name); });
            return titles;
        }
        function currentTitle() {
            const titles = unlockedTitles();
            return titles.includes(gameState.titulo) ? gameState.titulo : titles[titles.length > 1 ? 1 : 0];
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        function initApp() {
            const saved = localStorage.getItem('dashboard2026_data_v6');
            if (saved) {
                appData = JSON.parse(saved);
                for (let k in initialData) {
                    if (!appData[k]) appData[k] = initialData[k];
                }
            } else {
                appData = JSON.parse(JSON.stringify(initialData));
            }
            normalizeData();
            loadGame();
            applyShields();
            checkTrophies(true);
            todaysMissions();
            renderAll();
            initCloudSync();
        }

        // ==========================================
        // NAVEGAÇÃO
        // ==========================================
        function go(view, key) {
            currentView = view;
            if (key) currentTabId = key;
            renderAll();
            window.scrollTo(0, 0);
        }
        function renderAll() {
            normalizeData();
            if (currentView === 'mundo' && !(currentTabId && appData[currentTabId])) currentView = 'mundos';
            renderSidebar();
            renderBottomNav();
            const views = { base: renderBase, mundos: renderMundos, mundo: () => renderWorld(currentTabId), missoes: renderMissoes, trofeus: renderTrofeus, perfil: renderPerfil };
            document.getElementById('mainContent').innerHTML = (views[currentView] || renderBase)();
        }

        function renderSidebar() {
            const L = levelInfo(totalXP(), playerCost);
            const st = streak();
            const navItem = (view, ic, label) => `<button class="nav-btn${currentView === view ? ' active' : ''}" onclick="go('${view}')"${currentView === view ? ' aria-current="page"' : ''}><span class="nb-icon">${icon(ic, 18)}</span>${label}</button>`;
            let worlds = '';
            orderedTabKeys().forEach(k => {
                const on = currentView === 'mundo' && currentTabId === k;
                const wl = levelInfo(worldXP(k), worldCost).lv;
                worlds += `<button class="nav-btn${on ? ' active' : ''}" style="${worldVars(k)}" onclick="go('mundo','${k}')"${on ? ' aria-current="page"' : ''}><span class="nb-icon">${worldIcon(k, 18)}</span>${escapeHtml(world(k).name)}<span class="nb-lv">Nv ${wl}</span></button>`;
            });
            document.getElementById('sidebar').innerHTML = `
                <div class="brand"><span class="logo">${icon('rocket', 20)}</span><span>Dashboard 2026<small>Seu painel pessoal</small></span></div>
                <button class="side-hud" onclick="go('perfil')" aria-label="Abrir seu perfil">
                    <span class="sh-top"><span class="sh-lv">${L.lv}</span><span><span class="sh-name">${escapeHtml(gameState.nome || 'Jogador')}</span><br><span class="sh-sub">${escapeHtml(currentTitle())} · ${icon('flame', 12)} ${st} ${st === 1 ? 'dia' : 'dias'}</span></span></span>
                    <span class="xp-bar" style="height:10px"><div style="width:${L.pct}%"></div></span>
                    <span class="sh-sub">${fmt(L.cur)} / ${fmt(L.need)} XP para o nível ${L.lv + 1}</span>
                </button>
                <nav class="side-nav">
                    ${navItem('base', 'home', 'Base')}
                    ${navItem('missoes', 'flame', 'Missões')}
                    ${navItem('trofeus', 'trophy', 'Troféus')}
                    ${navItem('perfil', 'user', 'Perfil')}
                    <div class="side-label">Mundos</div>
                    ${worlds}
                </nav>
                <div class="side-foot">
                    <button class="btn-ghost-dark" onclick="exportData()"><i class="bi bi-download"></i> Fazer backup</button>
                    <div class="sync-status-text">${escapeHtml(syncStatus)}</div>
                </div>`;
        }
        function renderBottomNav() {
            const item = (view, ic, label) => {
                const on = currentView === view || (view === 'mundos' && currentView === 'mundo');
                return `<button class="bn-btn" onclick="go('${view}')"${on ? ' aria-current="page"' : ''}>${icon(ic, 22)}${label}</button>`;
            };
            document.getElementById('bottomNav').innerHTML = item('base', 'home', 'Base') + item('mundos', 'compass', 'Mundos') + item('missoes', 'flame', 'Missões') + item('trofeus', 'trophy', 'Troféus') + item('perfil', 'user', 'Perfil');
        }

        // ==========================================
        // TELAS
        // ==========================================
        function playerCardHTML() {
            const L = levelInfo(totalXP(), playerCost);
            const st = streak();
            const esc = gameState.escudos || 0;
            const nome = gameState.nome || 'Jogador';
            return `<section class="player-card" aria-label="Seu nível">
                <div class="pc-top">
                    <div class="avatar" aria-hidden="true">${escapeHtml(nome.trim().charAt(0).toUpperCase() || 'J')}<span class="lv-badge">${L.lv}</span></div>
                    <div class="pc-name"><div class="pc-nome">${escapeHtml(nome)}</div><div class="pc-sub">Nível ${L.lv} · <b>${escapeHtml(currentTitle())}</b></div></div>
                    <div class="pc-chips">
                        <span class="chip-fire">${icon('flame', 16)} ${st} ${st === 1 ? 'dia' : 'dias'}</span>
                        <span class="chip-shield">${icon('shield', 14)} ${esc} ${esc === 1 ? 'escudo' : 'escudos'}</span>
                    </div>
                </div>
                <div>
                    <div class="xp-row"><span class="xp-num">${fmt(L.cur)} / ${fmt(L.need)} XP</span><span>faltam ${fmt(L.need - L.cur)} para o nível ${L.lv + 1}</span></div>
                    <div class="xp-bar" style="margin-top:6px" role="progressbar" aria-label="XP do nível" aria-valuenow="${L.pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${L.pct}%"></div></div>
                </div>
            </section>`;
        }

        function missionsHTML() {
            const list = todaysMissions();
            const m = gameState.missoes || {};
            const n = list.filter(x => x.done).length;
            let html = '<div class="card-w missions">';
            list.forEach(x => {
                html += `<div class="mission${x.done ? ' done' : ''}">
                    <span class="m-check">${icon('check', 16)}</span>
                    <span class="m-text">${escapeHtml(x.text)}${x.goal > 1 && !x.done ? `<small>${x.cur} de ${x.goal}</small>` : ''}</span>
                    <span class="xp-pill">${x.done ? 'feita' : '+' + x.xp + ' XP'}</span>
                </div>`;
            });
            html += `<div class="chest${m.bau ? ' open' : ''}">
                    <span class="chest-icon">${icon('chest', 22)}</span>
                    <div style="flex:1"><div style="font:700 0.9rem var(--font-display);color:var(--text-heading)">${m.bau ? 'Baú aberto!' : 'Baú diário · ' + n + ' de ' + list.length}</div>
                    <div class="pips">${list.map(x => `<span class="${x.done ? 'on' : ''}"></span>`).join('')}</div></div>
                    <span class="xp-pill">+${XP_BAU} XP</span>
                </div></div>`;
            return html;
        }

        function worldTile(k, big) {
            const w = world(k);
            const rows = appData[k].rows || [];
            const L = levelInfo(worldXP(k), worldCost);
            const done = rows.filter(r => r && isDone(k, r)).length;
            return `<button class="world-tile${big ? ' big' : ''}" style="${worldVars(k)}" onclick="go('mundo','${k}')">
                <span class="wt-icon">${worldIcon(k, big ? 24 : 20)}</span>
                <span class="wt-name">${escapeHtml(w.name)}</span>
                <span class="wt-meta">Nv ${L.lv} · ${done}/${rows.length}</span>
                ${big ? `<span class="mini-bar" aria-hidden="true"><span style="width:${L.pct}%"></span></span><span class="muted" style="font-size:.74rem;font-weight:600">${fmt(L.cur)} / ${fmt(L.need)} XP do mundo</span>` : ''}
            </button>`;
        }

        function continueItems() {
            const out = [];
            orderedTabKeys().forEach(k => {
                const c = cols(k);
                if (!c.prog) return;
                (appData[k].rows || []).forEach(r => {
                    if (!r || isDone(k, r) || isBoss(r)) return;
                    const st = c.status ? normStatus(r[c.status]) : '';
                    const ph = rowPhase(k, r);
                    if (st === 'ABERTO' || ph > 0) out.push({ k, r, ph });
                });
            });
            out.sort((a, b) => String(b.r.tocadoEm || '').localeCompare(String(a.r.tocadoEm || '')) || b.ph - a.ph);
            return out.slice(0, 3);
        }

        function renderBase() {
            const cont = continueItems();
            let contHTML = '';
            cont.forEach(({ k, r, ph }) => {
                const c = cols(k);
                contHTML += `<div class="card-w continue-item" style="${worldVars(k)}">
                    <span class="ci-icon">${worldIcon(k, 22)}</span>
                    <div class="ci-body">
                        <div class="ci-title">${escapeHtml(r[c.item] || '')}</div>
                        <div class="segs-static" aria-hidden="true">${[1, 2, 3, 4].map(n => `<span class="${n <= ph ? 'on' : ''}"></span>`).join('')}</div>
                        <div class="ci-meta">Fase ${ph} de 4 · ${escapeHtml(world(k).name)}</div>
                    </div>
                    <button class="btn-3d btn-w btn-xs" onclick="advancePhase('${k}','${r.id}')">+1 fase</button>
                </div>`;
            });
            if (!contHTML) contHTML = `<div class="card-w muted" style="padding:16px;font-weight:600">Nada em jogo agora. Abra um mundo e comece algo da fila.</div>`;
            return `<div class="view">
                ${playerCardHTML()}
                <section class="stack">
                    <div class="sec-head"><h2>Missões de hoje</h2><button class="link-btn" onclick="go('missoes')">Ver todas</button></div>
                    ${missionsHTML()}
                </section>
                <section class="stack">
                    <div class="sec-head"><h2>Continue de onde parou</h2></div>
                    ${contHTML}
                </section>
                <section class="stack">
                    <div class="sec-head"><h2>Seus mundos</h2><span class="muted" style="font-size:.8rem;font-weight:700">${orderedTabKeys().length} mundos</span></div>
                    <div class="worlds-grid">${orderedTabKeys().map(k => worldTile(k, false)).join('')}</div>
                </section>
            </div>`;
        }

        function renderMundos() {
            return `<div class="view">
                <h1 style="font-size:1.6rem;font-weight:800">Mundos</h1>
                <p class="muted" style="margin:-8px 0 0;font-weight:500">Cada área da sua vida tem nível próprio. Zere itens para subir.</p>
                <div class="worlds-grid">${orderedTabKeys().map(k => worldTile(k, true)).join('')}</div>
            </div>`;
        }

        // ===== Um mundo (lista de itens) =====
        const FILTERS = [
            { id: 'ALL', label: 'Todos' },
            { id: 'ABERTO', label: 'Em jogo' },
            { id: 'AGUARDANDO', label: 'Na fila' },
            { id: 'VAZIO', label: 'Novos' },
            { id: 'CONCLUIDO', label: 'Zerados' }
        ];
        const STATUS_LABEL = { CONCLUIDO: 'Zerado', ABERTO: 'Em jogo', AGUARDANDO: 'Na fila', '': 'Novo' };
        function statusBucket(v) {
            const s = normStatus(v);
            if (s === 'CONCLUIDO' || s === 'ABERTO' || s === 'AGUARDANDO') return s;
            return 'VAZIO';
        }

        function renderWorld(key) {
            const tabData = appData[key];
            const w = world(key);
            const c = cols(key);
            const rows = tabData.rows || [];
            const L = levelInfo(worldXP(key), worldCost);
            const done = rows.filter(r => r && isDone(key, r)).length;
            const filter = filterConfig[key] || 'ALL';

            // Ordem padrão por status (Em jogo, Na fila, Novo, Zerado), até o usuário ordenar manualmente
            if (c.status && !sortConfig[key]) {
                tabData.rows.sort((a, b) => statusSortPriority(a[c.status]) - statusSortPriority(b[c.status]));
            }

            let chips = '';
            if (c.status) {
                FILTERS.forEach(f => {
                    const n = f.id === 'ALL' ? rows.length : rows.filter(r => r && statusBucket(r[c.status]) === f.id).length;
                    chips += `<button class="chip" aria-pressed="${filter === f.id}" onclick="filterByStatus('${key}','${f.id}')">${f.label} · ${n}</button>`;
                });
            }

            const bosses = rows.filter(r => isBoss(r) && !isDone(key, r));
            let bossHTML = '';
            if (bosses.length && filter !== 'CONCLUIDO') {
                bossHTML = `<section class="stack"><div class="sec-head"><h2>Chefões</h2></div>${bosses.map(r => bossCard(key, r)).join('')}</section>`;
            }

            let listHTML;
            if (filter === 'CONCLUIDO') {
                listHTML = collectionHTML(key);
            } else {
                listHTML = tableHTML(key, filter);
            }

            return `<div class="view" style="${worldVars(key)}">
                <header class="world-head">
                    <div class="wh-top">
                        <button class="icon-btn" onclick="go('mundos')" aria-label="Voltar para os mundos">${icon('back', 22)}</button>
                        <span class="wh-icon">${worldIcon(key, 26)}</span>
                        <div style="flex:1;min-width:0"><h1>${escapeHtml(w.name)}</h1><div class="wh-sub">Mundo nível ${L.lv} · ${done} de ${rows.length} zerados</div></div>
                    </div>
                    <div>
                        <div class="wh-xp"><span>${fmt(L.cur)} / ${fmt(L.need)} XP do mundo</span><span>próximo: nível ${L.lv + 1}</span></div>
                        <div class="wh-bar" style="margin-top:6px"><div style="width:${L.pct}%"></div></div>
                    </div>
                </header>
                <div class="controls">
                    <div class="chips" role="group" aria-label="Filtrar por status">${chips}</div>
                    ${c.status ? `<button class="btn-3d btn-light3 btn-xs" onclick="sortTable('${key}', '${escapeAttr(c.status)}')" title="Ordenar por status"><i class="bi bi-sort-down"></i> Status</button>` : ''}
                    <button class="btn-3d btn-primary3" onclick="openAddModal('${key}')">${icon('plus', 18)} Novo item</button>
                </div>
                ${bossHTML}
                ${listHTML}
            </div>`;
        }

        function tableHTML(key, filter) {
            const tabData = appData[key];
            const c = cols(key);
            let rows = (tabData.rows || []).filter(r => r && !(isBoss(r) && !isDone(key, r)));
            if (c.status && filter !== 'ALL') rows = rows.filter(r => statusBucket(r[c.status]) === filter);

            let head = '<th style="width:150px;cursor:default">Ações</th>';
            tabData.columns.forEach(col => {
                let sortIcon = '';
                if (sortConfig[key] && sortConfig[key].col === col) {
                    sortIcon = sortConfig[key].dir === 'asc' ? '<i class="bi bi-caret-up-fill sort-icon"></i>' : '<i class="bi bi-caret-down-fill sort-icon"></i>';
                }
                const label = col === c.prog ? 'Fases' : col;
                head += `<th onclick="sortTable('${key}', '${escapeAttr(col)}')" title="Clique para ordenar">${escapeHtml(label)} ${sortIcon}</th>`;
            });

            let body = '';
            rows.forEach(row => {
                const rowStatusClass = c.status ? getStatusClass(row[c.status]) : '';
                const canBoss = key === 'metas' && !isDone(key, row);
                body += `<tr id="tr-${row.id}" data-status="${rowStatusClass}">
                    <td class="td-actions"><div class="action-btns">
                        <button class="btn-icon drag-handle" onpointerdown="startDrag(event, '${key}', '${row.id}')" title="Segurar e arrastar para reordenar" aria-label="Arrastar para reordenar"><i class="bi bi-grip-vertical"></i></button>
                        <button class="btn-icon" onclick="duplicateRow('${key}', '${row.id}')" title="Duplicar" aria-label="Duplicar"><i class="bi bi-files"></i></button>
                        ${canBoss ? `<button class="btn-icon boss" onclick="openBossEditor('${key}', '${row.id}')" title="Transformar em chefão" aria-label="Transformar em chefão">${icon('sword', 16)}</button>` : ''}
                        <button class="btn-icon danger" onclick="deleteRow('${key}', '${row.id}')" title="Excluir" aria-label="Excluir"><i class="bi bi-trash3"></i></button>
                    </div></td>`;
                tabData.columns.forEach(col => {
                    const cu = col.toUpperCase().trim();
                    let cls = '';
                    if (col === c.item) cls = 'td-item';
                    else if (col === c.prog) cls = 'td-phase';
                    else if (cu === 'TIPO' || cu === 'STREAMING' || cu === 'CONSOLE') cls = 'td-hide-mobile';
                    body += `<td data-label="${escapeHtml(col)}"${cls ? ` class="${cls}"` : ''}>${renderCell(key, row, col)}</td>`;
                });
                body += '</tr>';
            });
            if (!rows.length) body = `<tr><td colspan="${tabData.columns.length + 1}" style="padding:24px;text-align:center" class="muted">Nada aqui por enquanto.</td></tr>`;

            return `<div class="list-box"><div class="table-responsive"><table class="items"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
        }

        function collectionHTML(key) {
            const c = cols(key);
            const rows = (appData[key].rows || []).filter(r => r && isDone(key, r));
            if (!rows.length) return `<div class="card-w muted" style="padding:20px;text-align:center">Sua coleção ainda está vazia. Zere algo para ganhar o primeiro card.</div>`;
            const order = { lendario: 0, epico: 1, raro: 2, comum: 3 };
            const sorted = rows.slice().sort((a, b) => order[rarity(rowNota(key, a))] - order[rarity(rowNota(key, b))]);
            return `<div class="collection" style="${worldVars(key)}">${sorted.map(r => {
                const n = rowNota(key, r), rr = cardTier(key, n);
                return `<button class="ccard r-${rr}" onclick="openZerou('${key}','${r.id}',0,'rever')">
                    <span class="cc-tier t-${rr}">${tierLabel(key, rr)}</span>
                    <span class="cc-title">${escapeHtml(r[c.item] || '')}</span>
                    <span class="cc-nota t-${rr}">${!c.nota ? (r.zeradoEm ? 'em ' + fmtDate(r.zeradoEm) : '') : isNaN(n) ? 'sem nota' : 'Nota ' + n}</span>
                </button>`;
            }).join('')}</div>`;
        }

        function bossCard(key, row) {
            const c = cols(key);
            const et = row.chefao.etapas;
            const d = bossDone(row), t = et.length;
            const hp = Math.round(100 * (t - d) / t);
            const cur = et.findIndex(e => !e.feito);
            const steps = et.map((e, i) => `<div class="boss-step${e.feito ? ' done' : i === cur ? ' cur' : ''}">Golpe ${i + 1}${e.feito ? ' ✓' : ''}<span>${escapeHtml(e.nome || '')}</span></div>`).join('');
            return `<section class="boss-card" aria-label="Chefão ${escapeHtml(row[c.item] || '')}">
                <div class="boss-top">
                    <span class="boss-icon">${icon('shield', 30)}</span>
                    <div style="flex:1;min-width:0"><span class="boss-badge">CHEFÃO</span><h3 class="boss-name">${escapeHtml(row[c.item] || '')}</h3></div>
                </div>
                <div>
                    <div class="hp-row"><span style="color:var(--fire-light)">Vida: ${t - d} de ${t} etapas</span><span style="color:var(--text-sidebar)">−${100 - hp}% de vida</span></div>
                    <div class="hp-bar" style="margin-top:6px"><div style="width:${hp}%"></div></div>
                </div>
                <div class="boss-steps">${steps}</div>
                <div class="boss-foot">
                    <div class="bf-text">Cada golpe vale <b>+${XP_GOLPE} XP</b>. Derrotar: <b>+${XP_CHEFAO} XP</b>.</div>
                    <button class="btn-3d btn-dark btn-xs" onclick="openBossEditor('${key}','${row.id}')" aria-label="Editar etapas">${icon('edit', 16)}</button>
                    ${d > 0 ? `<button class="btn-3d btn-dark btn-xs" onclick="bossHit('${key}','${row.id}',-1)" aria-label="Desfazer último golpe">${icon('undo', 16)}</button>` : ''}
                    <button class="btn-3d btn-xp" onclick="bossHit('${key}','${row.id}',1)">${icon('sword', 18)} Dar golpe</button>
                </div>
            </section>`;
        }

        // ===== Missões e ofensiva =====
        function renderMissoes() {
            const st = streak();
            const ws = weekStart(todayStr());
            const today = todayStr();
            const names = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
            let week = '';
            for (let i = 0; i < 7; i++) {
                const d = addDays(ws, i);
                const l = (gameState.log || {})[d];
                let cls = '', inner = '';
                if (isActive(d)) { cls = 'on'; inner = icon('flame', 16); }
                else if (l && l.escudo) { cls = 'shield'; inner = icon('shield', 14); }
                else if (d === today) cls = 'today';
                week += `<div class="${d === today ? 'is-today' : ''}">${d === today ? 'Hoje' : names[i]}<span class="dot ${cls}" style="color:#fff">${inner}</span></div>`;
            }
            const w = weekly();
            const bars = [...Array(w.def.goal)].map((_, i) => `<span class="${i < w.cur ? 'on' : ''}"></span>`).join('');
            const esc = gameState.escudos || 0;
            return `<div class="view">
                <section class="streak-card">
                    <div class="sc-top">
                        <span class="sc-flame">${icon('flame', 32)}</span>
                        <div style="flex:1"><div class="sc-num">${st} ${st === 1 ? 'dia' : 'dias'}</div><div style="font-size:.84rem;font-weight:600;color:var(--text-sidebar);margin-top:4px">de ofensiva · recorde: ${Math.max(gameState.recorde || 0, st)} dias</div></div>
                        <span class="chip-shield">${icon('shield', 14)} ${esc} ${esc === 1 ? 'escudo' : 'escudos'}</span>
                    </div>
                    <div class="week">${week}</div>
                    <div style="font-size:.8rem;font-weight:600;color:var(--text-sidebar)">${isActive(today) ? 'Fogo aceso hoje. Volte amanhã para continuar.' : 'Avance uma fase, zere ou dê nota em algo hoje para manter o fogo.'}</div>
                </section>
                <section class="stack">
                    <div class="sec-head"><h2>Diárias</h2><span class="muted" style="font-size:.8rem;font-weight:700">renovam à meia-noite</span></div>
                    ${missionsHTML()}
                </section>
                <section class="stack">
                    <div class="sec-head"><h2>Desafio da semana</h2></div>
                    <div class="card-w" style="padding:16px;display:flex;flex-direction:column;gap:10px">
                        <div style="font:700 1rem var(--font-display);color:var(--text-heading)">${escapeHtml(w.def.text)}</div>
                        <div class="challenge-bar">${bars}</div>
                        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;font-weight:700"><span class="muted">${w.done ? 'Concluído!' : w.cur + ' de ' + w.def.goal + ' · termina ' + fmtDate(w.end)}</span><span style="color:var(--primary-dark)">+${XP_SEMANA} XP e 1 escudo</span></div>
                    </div>
                </section>
                <p class="muted" style="font-size:.84rem;font-weight:500;margin:0">Escudos: você guarda até 2. Se passar um dia sem jogar, um escudo protege a ofensiva sozinho. Perder a ofensiva não tira XP; o recorde fica guardado.</p>
            </div>`;
        }

        // ===== Troféus =====
        function renderTrofeus() {
            const s = stats();
            const list = trophyList();
            const states = list.map(t => trophyState(t, s));
            const count = [0, 0, 0, 0];
            states.forEach(x => count[x.tier]++);
            if (!selectedTrophy || !list.find(t => t.id === selectedTrophy)) selectedTrophy = list[0] && list[0].id;
            const grid = list.map((t, i) => {
                const x = states[i];
                return `<button class="trophy tier-${x.tier}" aria-pressed="${t.id === selectedTrophy}" onclick="selectTrophy('${t.id}')">
                    <span class="medal-ring">${icon(t.icon, 22)}</span>
                    <span class="tr-name">${escapeHtml(t.name)}</span>
                    <span class="tr-tier">${TIER_NAME[x.tier]}</span>
                </button>`;
            }).join('');
            const si = list.findIndex(t => t.id === selectedTrophy);
            const sel = list[si], ss = states[si];
            const pct = ss.tier === 3 ? 100 : Math.max(3, Math.round(100 * ss.v / ss.next));
            const nextName = ss.tier === 0 ? 'bronze' : ss.tier === 1 ? 'prata' : 'ouro';
            const earned = list.length - count[0];
            return `<div class="view">
                <div>
                    <h1 style="font-size:1.6rem;font-weight:800">Troféus</h1>
                    <p class="muted" style="margin:4px 0 0;font-weight:600">${earned} de ${list.length} conquistados · toque para ver</p>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <span class="count-chip" style="background:#FEF3C7;color:#92400E">${count[3]} ouro</span>
                    <span class="count-chip" style="background:#EEEFF7;color:#3F3F5C">${count[2]} prata</span>
                    <span class="count-chip" style="background:#FFEDD5;color:#7C2D12">${count[1]} bronze</span>
                </div>
                <section class="trophy-detail" aria-live="polite">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>${escapeHtml(sel.name)}</h3><span style="font:800 .78rem var(--font-display);color:var(--xp-light)">${TIER_NAME[ss.tier]}</span></div>
                    <div style="font-size:.86rem;font-weight:600;color:var(--text-sidebar)">${escapeHtml(sel.desc)}</div>
                    <div class="td-bar"><div style="width:${pct}%"></div></div>
                    <div style="font-size:.8rem;font-weight:700">${ss.tier === 3 ? 'Ouro conquistado!' : `Rumo ao ${nextName}: ${fmt(ss.v)} de ${fmt(ss.next)} ${sel.unit}`}${ss.tier > 0 ? ` · libera o título “${escapeHtml(sel.title || sel.name)}”` : ''}</div>
                </section>
                <div class="trophy-grid">${grid}</div>
            </div>`;
        }
        function selectTrophy(id) { selectedTrophy = id; renderAll(); }

        // ===== Perfil =====
        function renderPerfil() {
            const titles = unlockedTitles();
            const cur = currentTitle();
            const s = stats();
            const attrs = orderedTabKeys().map(k => {
                const L = levelInfo(worldXP(k), worldCost);
                return `<div class="attr" style="${worldVars(k)}"><span class="a-name">${escapeHtml(world(k).attr)}</span><span class="a-bar"><span style="width:${L.pct}%"></span></span><span class="a-lv">Nv ${L.lv}</span></div>`;
            }).join('');
            const xpRows = [
                ['Avançar uma fase', '+' + XP_FASE],
                ...orderedTabKeys().map(k => ['Zerar em ' + world(k).name, '+' + world(k).xp]),
                ['Dar nota a algo zerado', '+' + XP_NOTA],
                ['Golpe em chefão · derrotar', '+' + XP_GOLPE + ' · +' + XP_CHEFAO],
                ['Missão diária · baú (3 de 3)', '+10 a 25 · +' + XP_BAU],
                ['Desafio da semana', '+' + XP_SEMANA + ' e 1 escudo']
            ].map(([a, b]) => `<tr><td>${escapeHtml(a)}</td><td>${b}</td></tr>`).join('');
            return `<div class="view">
                ${playerCardHTML()}
                <section class="card-w" style="padding:16px;display:flex;flex-direction:column;gap:10px">
                    <div class="sec-head"><h2>Título equipado</h2><button class="link-btn" onclick="editName()">Trocar nome</button></div>
                    <div class="title-chips" role="group" aria-label="Escolha seu título">
                        ${titles.map(t => `<button class="title-chip" aria-pressed="${t === cur}" onclick="setTitle('${escapeAttr(t)}')">${escapeHtml(t)}</button>`).join('')}
                    </div>
                    <span class="muted" style="font-size:.8rem;font-weight:600">Novos títulos chegam com os troféus.</span>
                </section>
                <section class="stack">
                    <div class="sec-head"><h2>Atributos</h2></div>
                    <div class="card-w" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">${attrs}</div>
                </section>
                <section class="stack">
                    <div class="sec-head"><h2>Seu 2026 até agora</h2></div>
                    <div class="stats">
                        <div class="stat"><b style="color:#15803D">${s.total}</b><span>zerados</span></div>
                        <div class="stat"><b style="color:#C2410C">${Math.max(gameState.recorde || 0, streak())}</b><span>dias recorde</span></div>
                        <div class="stat"><b style="color:#92400E">${s.lend}</b><span>lendários</span></div>
                        <div class="stat"><b style="color:var(--primary-dark)">${s.notas}</b><span>notas</span></div>
                    </div>
                </section>
                <button class="btn-3d btn-primary3" style="justify-content:flex-start;padding:14px 16px;min-height:64px;text-align:left" onclick="openRetro()">
                    ${icon('play', 24)}<span><span style="display:block;font-size:1rem">Retrospectiva de ${monthName()}</span><span style="display:block;font:600 .78rem var(--font-body);margin-top:2px">Seus destaques do mês</span></span>
                </button>
                <details class="card-w howto">
                    <summary>Como ganhar XP</summary>
                    <div class="howto-body">
                        <table class="xp-table">${xpRows}</table>
                        <p class="muted" style="font-size:.82rem;margin:10px 0 0">Nível do jogador: ${'200 × nível + 100'} XP para subir. Nível do mundo: ${'80 × nível + 40'}. Nada tira XP; desfazer um item só devolve o XP dele.</p>
                    </div>
                </details>
                <section class="card-w" style="padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                    <span style="color:#15803D">${icon('cloud', 20)}</span>
                    <span class="sync-status-text muted" style="flex:1;font-size:.84rem;font-weight:600">${escapeHtml(syncStatus)}</span>
                    <button class="btn-3d btn-light3 btn-xs" onclick="exportData()"><i class="bi bi-download"></i> Fazer backup</button>
                </section>
            </div>`;
        }
        function setTitle(t) { gameState.titulo = t; saveGame(); renderAll(); }
        function editName() {
            const n = prompt('Como você quer ser chamado?', gameState.nome || '');
            if (n === null) return;
            gameState.nome = n.trim().slice(0, 30) || 'Jogador';
            saveGame(); renderAll();
        }
        function monthName() { return new Date().toLocaleDateString('pt-BR', { month: 'long' }); }

        // ==========================================
        // AÇÕES DO JOGO
        // ==========================================
        function touch(row) { row.tocadoEm = new Date().toISOString(); }

        // Guarda os dados, confere missões/desafio/troféus e mostra o retorno (+XP, nível, vitória)
        function commit(before, zerou) {
            autoSave();
            checkMissions();
            checkWeekly();
            updateRecord();
            saveGame();
            const after = snapshot();
            const gained = after.xp - before.xp;
            renderAll();
            if (zerou) openZerou(zerou.k, zerou.id, gained, 'novo');
            else if (gained > 0) showToast(`+${gained} XP`, 'xp');
            if (after.lv > before.lv) levelUp(after.lv);
            checkTrophies(false);
        }

        function advancePhase(key, id) {
            const row = findRow(key, id);
            if (row) changePhase(key, id, rowPhase(key, row) + 1);
        }
        function setPhase(key, id, n) {
            const row = findRow(key, id);
            if (!row) return;
            const cur = rowPhase(key, row);
            changePhase(key, id, n === cur ? n - 1 : n);
        }
        function changePhase(key, id, newPh) {
            const row = findRow(key, id);
            if (!row) return;
            const c = cols(key);
            const old = rowPhase(key, row);
            newPh = Math.max(0, Math.min(4, newPh));
            if (newPh === old) return;
            const before = snapshot();
            const wasDone = isDone(key, row);
            if (c.prog) row[c.prog] = String(newPh * 25);
            let zerou = null;
            if (c.status) {
                const st = normStatus(row[c.status]);
                if (newPh === 4) {
                    row[c.status] = 'CONCLUIDO';
                } else if (newPh > 0) {
                    if (st === 'AGUARDANDO') logEvent('q', key);
                    row[c.status] = 'ABERTO';
                } else if (wasDone) {
                    row[c.status] = '';
                }
            }
            for (let i = old; i < newPh; i++) logEvent('f', key);
            if (newPh === 4 && !wasDone) {
                row.zeradoEm = todayStr();
                logEvent('z', key);
                zerou = { k: key, id };
            }
            touch(row);
            commit(before, zerou);
        }

        function setStatus(key, id, value) {
            const row = findRow(key, id);
            const c = cols(key);
            if (!row || !c.status) return;
            const old = normStatus(row[c.status]), nv = normStatus(value);
            if (old === nv) return;
            const before = snapshot();
            const wasDone = old === 'CONCLUIDO', nowDone = nv === 'CONCLUIDO';
            row[c.status] = value;
            let zerou = null;
            if (nowDone && !wasDone) {
                if (c.prog) {
                    const oldPh = Math.min(4, Math.floor((parseInt(row[c.prog]) || 0) / 25));
                    for (let i = oldPh; i < 4; i++) logEvent('f', key);
                    row[c.prog] = '100';
                }
                row.zeradoEm = todayStr();
                logEvent('z', key);
                zerou = { k: key, id };
            }
            if (wasDone && !nowDone && c.prog && (parseInt(row[c.prog]) || 0) >= 100) row[c.prog] = '75';
            if (old === 'AGUARDANDO' && nv === 'ABERTO') logEvent('q', key);
            touch(row);
            commit(before, zerou);
        }

        function setNota(key, id, value) {
            const row = findRow(key, id);
            const c = cols(key);
            if (!row || !c.nota) return;
            const clean = String(value).replace(/[^0-9.,]/g, '').replace(',', '.').trim();
            if (String(row[c.nota] === undefined ? '' : row[c.nota]) === clean) { renderAll(); return; }
            const before = snapshot();
            const had = !isNaN(rowNota(key, row));
            row[c.nota] = clean;
            if (isDone(key, row) && !had && clean !== '') logEvent('n', key);
            touch(row);
            commit(before, null);
        }

        // ===== Chefões (metas grandes divididas em golpes) =====
        function bossHit(key, id, delta) {
            const row = findRow(key, id);
            if (!isBoss(row)) return;
            const c = cols(key);
            const before = snapshot();
            const et = row.chefao.etapas;
            if (delta > 0) {
                const i = et.findIndex(e => !e.feito);
                if (i < 0) return;
                et[i].feito = true;
                logEvent('f', key);
            } else {
                let i = -1;
                et.forEach((e, j) => { if (e.feito) i = j; });
                if (i < 0) return;
                et[i].feito = false;
            }
            const zerou = syncBossStatus(key, row);
            touch(row);
            commit(before, zerou);
        }
        function syncBossStatus(key, row) {
            const c = cols(key);
            const d = bossDone(row), t = row.chefao.etapas.length;
            const wasDone = isDone(key, row);
            if (c.prog) row[c.prog] = String(Math.round(100 * d / t));
            if (!c.status) return null;
            if (d === t) {
                if (!wasDone) {
                    row[c.status] = 'CONCLUIDO';
                    row.zeradoEm = todayStr();
                    logEvent('z', key);
                    return { k: key, id: row.id };
                }
            } else {
                row[c.status] = d > 0 ? 'ABERTO' : (wasDone ? '' : row[c.status]);
            }
            return null;
        }
        let bossCtx = null;
        function openBossEditor(key, id) {
            const row = findRow(key, id);
            if (!row) return;
            const c = cols(key);
            bossCtx = { key, id };
